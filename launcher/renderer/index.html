<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ModelDock</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    </div>
    <div class="brand-text">
      <h1>ModelDock</h1>
      <span class="sub">Multi-model AI Workstation</span>
    </div>
  </div>
  <div class="header-status">
    <span class="status-chip" id="chipChatGPT">
      <span class="status-dot" id="dotChatGPT"></span>
      <span>ChatGPT</span>
    </span>
    <span class="status-chip" id="chipGemini">
      <span class="status-dot" id="dotGemini"></span>
      <span>Gemini</span>
    </span>
    <span class="status-chip" id="chipDeepSeek">
      <span class="status-dot" id="dotDeepSeek"></span>
      <span>DeepSeek</span>
    </span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btnTheme" title="切換深色 / 淺色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="btnHelp" title="使用說明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
  </div>
</header>

<!-- Embedded Browser / Login Manager -->
<div class="card">
  <div class="card-head">
    <h2>內嵌瀏覽器</h2>
    <div class="card-actions">
      <button class="btn-ghost" id="btnToggleLogin" aria-pressed="true">隱藏登入頁</button>
    </div>
  </div>
  <div class="tab-bar" id="browserTabBar" style="margin-bottom: 8px;">
    <button class="tab-btn active" data-provider="chatgpt" id="tabBtnChatGPT">ChatGPT</button>
    <button class="tab-btn" data-provider="gemini" id="tabBtnGemini">Gemini</button>
    <button class="tab-btn" data-provider="deepseek" id="tabBtnDeepSeek">DeepSeek</button>
  </div>
  <div class="hint-text">在右側完成各平台登入，Electron 自動擷取 Cookie 與 Token，免外掛全本機自動化。</div>
</div>

<!-- Service Endpoints -->
<div class="card">
  <div class="card-head">
    <h2>Service Endpoints</h2>
    <div class="card-actions">
      <button class="btn-ghost" id="btnCopyEndpoint">複製端點</button>
      <button class="btn-ghost" id="btnCopyConfig">複製配置</button>
    </div>
  </div>
  <div class="endpoint-box" id="endpointBox">
    <span class="badge-method">GET</span>
    <code>http://127.0.0.1:8765/v1</code>
  </div>
  <div class="stat-row">
    <div class="stat-item">
      <span class="stat-label">HTTP Server</span>
      <span class="stat-value" id="httpStatus">--</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">MCP Server</span>
      <span class="stat-value" id="mcpStatus">--</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Python Bridge</span>
      <span class="stat-value" id="bridgeStatus">--</span>
    </div>
  </div>
</div>

<!-- Conversation Test -->
<div class="card">
  <div class="card-head">
    <h2>對話測試</h2>
    <div class="card-actions">
      <button class="btn-ghost" id="btnNewChat">開新對話</button>
      <button class="btn-ghost" id="btnClear">清空</button>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group flex-1">
      <label class="form-label">模型</label>
      <div class="select-wrap">
        <select id="modelSelect">
          <optgroup label="ChatGPT (Electron DOM 自動化)">
            <option value="chatgpt-web/auto">chatgpt-web/auto</option>
          </optgroup>
          <optgroup label="Gemini (Cookie 直連)">
            <option value="gemini-web/flash" selected>gemini-web/flash</option>
          </optgroup>
          <optgroup label="DeepSeek (Token + PoW 直連)">
            <option value="deepseek-web/chat">deepseek-web/chat</option>
            <option value="deepseek-web/reasoner">deepseek-web/reasoner</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="form-group flex-1">
      <label class="form-label">對話模式</label>
      <div class="select-wrap">
        <select id="chatMode">
          <option value="temporary">無痕（不留紀錄）</option>
          <option value="normal">一般（保留紀錄）</option>
        </select>
      </div>
    </div>
  </div>

  <label class="form-label">Prompt</label>
  <textarea id="prompt" placeholder="輸入測試訊息…" rows="3"></textarea>

  <div class="form-row">
    <label class="check-label"><input type="checkbox" id="contCheck" /><span>沿用上一輪</span></label>
    <div class="form-spacer"></div>
    <span class="pill-status" id="askState">idle</span>
    <button class="btn-primary" id="btnAsk">送出</button>
  </div>

  <div class="output-box" id="askOut">回覆會顯示在這裡…</div>
</div>

<!-- Bottom: Events & Diagnostics -->
<div class="card">
  <div class="card-head">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="eventsTab">最近事件 <span class="tab-count" id="eventCount">0</span></button>
      <button class="tab-btn" data-tab="doctorTab">診斷 <span class="tab-count" id="doctorCount">--</span></button>
    </div>
    <div class="card-actions">
      <button class="btn-ghost" id="btnCopyLogs">複製</button>
      <button class="btn-ghost" id="btnRefresh">重新整理</button>
    </div>
  </div>
  <div class="tab-panel active" id="eventsTab">
    <div class="event-list" id="eventList">
      <div class="event-empty">尚無事件</div>
    </div>
  </div>
  <div class="tab-panel" id="doctorTab">
    <div id="doctorOutput" class="hint-text">讀取中…</div>
  </div>
</div>

<!-- Help Modal -->
<div class="modal-overlay" id="helpOverlay">
  <div class="modal" role="dialog" aria-label="使用說明">
    <div class="modal-head">
      <h2>使用說明</h2>
      <button class="btn-ghost" id="btnCloseHelp">關閉</button>
    </div>
    <div class="hint-text">應用開著時，以下端點皆可呼叫。點「複製」即拷貝。</div>
    <div id="helpCards"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="./renderer.js"></script>
</body>
</html>
