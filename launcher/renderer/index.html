<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatDock</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <div class="title">
    <h1>ChatDock</h1>
    <div class="sub">右側為 ChatGPT 登入頁 · 登入態重開保留</div>
  </div>
  <button class="icon-btn" id="btnTheme" title="切換深色 / 淺色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="icon-btn" id="btnHelp" title="使用說明">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
</header>

<div class="card">
  <div class="status-line">
    <span class="badge" id="loginBadge">[檢查中]</span>
    <span class="auto-note" id="autoNote">自動刷新中 · 更新於 --</span>
  </div>
  <div class="row">
    <button class="action toggle" id="btnToggleLogin" aria-pressed="true">隱藏登入頁</button>
    <button class="ghost" id="btnNewChat">開新對話</button>
  </div>
  <div class="hint">右側頁面登入 ChatGPT，看到輸入框即完成。隱藏登入頁可放大左側面板。上面是同一個按鈕，用切換方式顯示 / 隱藏。</div>
</div>

<div class="card">
  <h2>對話測試</h2>
  <label class="field">發送方式（同一個送出按鈕，切換協定）</label>
  <div class="seg" role="tablist" aria-label="發送方式">
    <button class="seg-btn active" id="segNative" role="tab" aria-selected="true">原生 /chat</button>
    <button class="seg-btn" id="segOai" role="tab" aria-selected="false">OpenAI 相容</button>
  </div>
  <div class="grid2">
    <div>
      <label class="field" for="oaiModel">模型 ID（OpenAI 相容用）</label>
      <div class="inline">
        <input id="oaiModel" list="modelList" value="gpt-web-port" spellcheck="false" />
        <button class="ghost small" id="btnModels" title="從 GET /v1/models 取得可用模型">取得模型</button>
      </div>
      <datalist id="modelList"></datalist>
    </div>
    <div>
      <label class="field" for="chatMode">對話紀錄模式</label>
      <select id="chatMode">
        <option value="temporary">無痕（temporary-chat，不留紀錄）</option>
        <option value="normal">一般（保留對話紀錄）</option>
      </select>
    </div>
  </div>
  <label class="field" for="prompt">prompt</label>
  <textarea id="prompt" placeholder="用一句話介紹台灣"></textarea>
  <div class="grid2">
    <label class="check"><input type="checkbox" id="cont" /><span>沿用上一輪（continue）</span></label>
    <label class="check"><input type="checkbox" id="contDefault" /><span>記住為預設（下次開啟沿用）</span></label>
  </div>
  <div class="row">
    <button class="action" id="btnAsk">送出</button>
    <button class="ghost" id="btnClear">清空</button>
    <span class="pill" id="askState">idle</span>
  </div>
  <div class="mono" id="askOut">回覆會顯示在這裡…</div>
  <div class="hint" id="askHint">目前：原生 /chat · 每次重開 · 無痕模式。</div>
</div>

<div class="modal-overlay" id="helpOverlay">
  <div class="modal" role="dialog" aria-label="使用說明">
    <div class="modal-head">
      <h2>使用說明</h2>
      <button class="ghost" id="btnCloseHelp">關閉</button>
    </div>
    <div class="hint">應用開著時，以下端點皆可呼叫。點「複製」即拷貝。</div>
    <div id="helpCards"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="./renderer.js"></script>
</body>
</html>
